name: Publish reviewed Um candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full SHA already reviewed, validated and merged into main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: um-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require the exact reviewed main commit
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the reviewed web candidate
        env:
          UM_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VITE_API_ORIGIN: ${{ vars.UM_API_ORIGIN }}
        run: npx tsx scripts/stage-web.ts --release
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the prepared artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
# Dispatch only after the documented gates and hosted backend verification.
# Enable Pages (GitHub Actions source) and set UM_API_ORIGIN during promotion.
